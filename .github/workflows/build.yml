name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install Cython==3.0.11 buildozer
          pip install legacy-cgi
          # Create cgi shim for Python 3.13+ build envs
          SITE=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "import legacy_cgi as cgi; import sys; sys.modules['cgi']=cgi" > $SITE/sitecustomize.py
          echo "import legacy_cgi as cgi" > $SITE/cgi.py || true
          python -c "import cgi; print('cgi ok')"
      - name: Accept licenses
        run: |
          mkdir -p ~/.buildozer
          yes | sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | buildozer android debug || true
      - name: Build APK
        env:
          PYTHONPATH: ""
        run: |
          rm -rf.buildozer
          buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Moses-Robot-APK
          path: bin/*.apk/*.apk
