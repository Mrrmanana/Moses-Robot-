name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer Cython==3.0.11 legacy-cgi
          PYLIB=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "import sys, legacy_cgi; sys.modules['cgi']=legacy_cgi" > $PYLIB/sitecustomize.py

      - name: Fix Android SDK Path
        run: |
          echo "Fixing sdkmanager location..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Create buildozer SDK folder and link it to system SDK
          mkdir -p $HOME/.buildozer/android/platform/
          rm -rf $HOME/.buildozer/android/platform/android-sdk
          ln -sf $ANDROID_HOME $HOME/.buildozer/android/platform/android-sdk
          # Also create old tools path that buildozer looks for
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          # Install needed tools
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "build-tools;37.0.0" "platforms;android-33" || true
          ls $HOME/.buildozer/android/platform/android-sdk/tools/bin/

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moses-Robot-APK
          path: bin/*.apk
