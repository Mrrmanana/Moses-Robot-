name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip libncurses6
          pip install buildozer cython==0.29.33
      - name: Accept licenses
        run: |
          mkdir -p ~/.buildozer
          yes | buildozer android debug || true
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi
      - name: Build APK
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Moses-Robot-APK
          path: bin/*.apk
